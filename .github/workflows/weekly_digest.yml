name: Weekly Hotel Performance Digest

on:
  schedule:
    # Trigger every Monday morning at 09:00 UTC (17:00 UTC+8)
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allows manual trigger from GitHub UI
    inputs:
      dry_run:
        description: 'Run in dry-run mode (archive previews without sending SMTP)'
        required: false
        type: boolean
        default: false

jobs:
  run-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit test suite
        run: |
          pytest

      - name: Execute Weekly Automation Pipeline
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL || 'deepseek/deepseek-chat' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          GOOGLE_SHEET_URL: ${{ secrets.GOOGLE_SHEET_URL }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python main.py --dry-run
          else
            python main.py
          fi

      - name: Upload Generated Email Previews as Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekly-email-previews
          path: output/emails/
          retention-days: 14
